<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        
        h1,
        h2 {
            color: #ff4500;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .checkout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        
        .box {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
        }
        
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }
        
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            color: #f5f5f5;
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #ff4500;
        }
        
        textarea {
            resize: vertical;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        
        .summary-item span:last-child {
            color: #ff4500;
        }
        
        .total {
            font-size: 18px;
            font-weight: bold;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }
        
        .btn-primary {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4500;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
        
        @media (max-width: 900px) {
            .checkout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Оформлення замовлення</h1>

        <form id="checkoutForm" class="checkout">

            <!-- Дані покупця -->
            <div class="box">
                <h2>Дані покупця</h2>

                <label>Імʼя</label>
                <input type="text" required>

                <label>Прізвище</label>
                <input type="text" required>

                <label>Email</label>
                <input type="email" required>

                <label>Телефон</label>
                <input type="tel" required>

                <label>Адреса доставки</label>
                <textarea rows="3" required></textarea>

                <label>Спосіб оплати</label>
                <select required>
                    <option value="">Оберіть спосіб</option>
                    <option>Оплата при отриманні</option>
                    <option>Карткою онлайн</option>
                </select>
            </div>

            <!-- Підсумок -->
            <div class="box">
                <h2>Ваше замовлення</h2>

                <div class="summary-item">
                    <span>Rainimator Hoodie</span>
                    <span>1200 ₴</span>
                </div>

                <div class="summary-item">
                    <span>Доставка</span>
                    <span>100 ₴</span>
                </div>

                <div class="summary-item total">
                    <span>Разом</span>
                    <span>1300 ₴</span>
                </div>

                <button type="submit" class="btn-primary">
                    Підтвердити замовлення
                </button>
            </div>

        </form>
    </div>

    <script>
        document.getElementById("checkoutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("🔥 Замовлення в Rainimator Shop успішно оформлено!");
        });
    </script>



    <footer>
        <p>Rainimator shop © 2025 • company</p>
    </footer>
</body>

</html>
