<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .cart-item {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .cart-item img {
            max-width: 100px;
            border-radius: 8px;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                            <script>
                                let cart = JSON.parse(localStorage.getItem('cart')) || [];

                                const cartItems = document.getElementById('cart-items');
                                const totalEl = document.getElementById('total');
                                const clearBtn = document.getElementById('clear-cart');

                                function renderCart() {
                                    cartItems.innerHTML = '';
                                    let total = 0;

                                    if (cart.length === 0) {
                                        cartItems.innerHTML = '<p class="empty-cart">Кошик порожній</p>';
                                        totalEl.textContent = '';
                                        return;
                                    }

                                    cart.forEach((item, index) => {
                                        total += item.price * item.quantity;

                                        const itemEl = document.createElement('div');
                                        itemEl.className = 'cart-item';

                                        itemEl.innerHTML = `
                                      <div class="cart-item-info">
                                        <span class="cart-item-name">${item.name}</span>
                                        <span class="cart-item-price">${item.price} грн</span>
                                      </div>
                            
                                      <div class="cart-item-controls">
                                        <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                                        <span class="cart-item-qty">${item.quantity}</span>
                                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                                      </div>
                            
                                      <button class="remove-btn" onclick="removeItem(${index})">×</button>
                                    `;

                                        cartItems.appendChild(itemEl);
                                    });

                                    totalEl.textContent = 'Разом: ' + total + ' грн';
                                    localStorage.setItem('cart', JSON.stringify(cart));
                                }

                                function changeQty(index, value) {
                                    cart[index].quantity += value;
                                    if (cart[index].quantity <= 0) {
                                        cart.splice(index, 1);
                                    }
                                    renderCart();
                                }

                                function removeItem(index) {
                                    cart.splice(index, 1);
                                    renderCart();
                                }

                                clearBtn.addEventListener('click', () => {
                                    cart = [];
                                    localStorage.removeItem('cart');
                                    renderCart();
                                });

                                renderCart();
                            </script>

                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</body>

</html>
