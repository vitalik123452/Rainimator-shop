<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .cart-item {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .cart-item img {
            max-width: 100px;
            border-radius: 8px;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
        
        footer p {
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                            <script>
                                let cart = JSON.parse(localStorage.getItem('cart')) || [];

                                const cartItems = document.getElementById('cart-items');
                                const totalEl = document.getElementById('total');
                                const clearBtn = document.getElementById('clear-cart');

                                function renderCart() {
                                    cartItems.innerHTML = '';
                                    let total = 0;

                                    if (cart.length === 0) {
                                        cartItems.innerHTML = '<p class="empty-cart">Кошик порожній</p>';
                                        totalEl.textContent = '';
                                        return;
                                    }

                                    cart.forEach((item, index) => {
                                        total += item.price * item.quantity;

                                        const itemEl = document.createElement('div');
                                        itemEl.className = 'cart-item';

                                        itemEl.innerHTML = `
                                      <div class="cart-item-info">
                                        <span class="cart-item-name">${item.name}</span>
                                        <span class="cart-item-price">${item.price} грн</span>
                                      </div>
                            
                                      <div class="cart-item-controls">
                                        <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                                        <span class="cart-item-qty">${item.quantity}</span>
                                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                                      </div>
                            
                                      <button class="remove-btn" onclick="removeItem(${index})">×</button>
                                    `;

                                        cartItems.appendChild(itemEl);
                                    });

                                    totalEl.textContent = 'Разом: ' + total + ' грн';
                                    localStorage.setItem('cart', JSON.stringify(cart));
                                }

                                function changeQty(index, value) {
                                    cart[index].quantity += value;
                                    if (cart[index].quantity <= 0) {
                                        cart.splice(index, 1);
                                    }
                                    renderCart();
                                }

                                function removeItem(index) {
                                    cart.splice(index, 1);
                                    renderCart();
                                }

                                clearBtn.addEventListener('click', () => {
                                    cart = [];
                                    localStorage.removeItem('cart');
                                    renderCart();
                                });

                                renderCart();
                            </script>

                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Кошик -->
    <div class="container py-5">
        <h2 class="mb-4">Ваш кошик</h2>
        <div id="cart-items">
            <!-- Items will be injected here -->
        </div>
        <div class="row mt-4">
            <div class="col-md-12 text-end">
                <h4>Загальна сума: <span id="cart-total">0</span> грн</h4>
                <button class="btn btn-primary btn-lg mt-2">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>
    <script>
        // Logic to render cart
        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalElement = document.getElementById('cart-total');
            const cart = getCart(); // from js/cart.js

            cartItemsContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="alert alert-info">Ваш кошик порожній. <a href="products.html">Перейти до каталогу</a></div>';
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;

                    const itemElement = document.createElement('div');
                    itemElement.classList.add('cart-item', 'row', 'align-items-center');
                    itemElement.innerHTML = `
                        <div class="col-md-2">
                            <img src="${item.image}" alt="${item.name}" class="img-fluid rounded">
                        </div>
                        <div class="col-md-4">
                            <h5>${item.name}</h5>
                            <p class="text-muted">Ціна: ${item.price} грн</p>
                        </div>
                        <div class="col-md-3">
                             <div class="input-group">
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <input type="text" class="form-control text-center" value="${item.quantity}" readonly>
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <div class="col-md-2 text-end">
                            <p class="fw-bold">${itemTotal} грн</p>
                        </div>
                        <div class="col-md-1 text-end">
                            <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });
            }
            cartTotalElement.textContent = total;
        }

        document.addEventListener('DOMContentLoaded', renderCart);
        // Listen for custom event from cart.js
        window.addEventListener('cartUpdated', renderCart);
    </script>

</body>
<footer>
    <p>Rainimator shop © 2025 • company</p>
</footer>

</html>
