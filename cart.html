<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .cart-item {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .cart-item img {
            max-width: 100px;
            border-radius: 8px;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Кошик -->
    <div class="container py-5">
        <h1 class="text-center mb-4">Ваш кошик</h1>
        <div class="cart-item d-flex align-items-center">
            <img src="https://via.placeholder.com/100" alt="Футболка">
            <div class="ms-3">
                <h5 class="mb-1">Футболка Rainimator</h5>
                <p class="mb-1">Ціна: 499 грн</p>
                <button class="btn btn-danger btn-sm">Видалити</button>
            </div>
        </div>
        <div class="cart-item d-flex align-items-center">
            <img src="https://via.placeholder.com/100" alt="Худі">
            <div class="ms-3">
                <h5 class="mb-1">Худі Rainimator</h5>
                <p class="mb-1">Ціна: 999 грн</p>
                <button class="btn btn-danger btn-sm">Видалити</button>
            </div>
        </div>
        <div class="text-end">
            <h4>Загальна сума: <span class="text-warning">1498 грн</span></h4>
            <button class="btn btn-primary btn-lg mt-3">Оформити замовлення</button>
        </div>
    </div>
</body>

</html>
