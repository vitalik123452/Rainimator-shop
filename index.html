<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .product-card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .product-card h5 {
            margin-top: 10px;
            color: #ff4500;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Каталог товарів -->
    <div class="container py-5">
        <h1 class="text-center mb-4">Каталог одягу</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://crowdmade.com/cdn/shop/files/Lord_of_the_Void_Black_-_7260455f-6c40-4798-a1af-74d5ba07dce5_360x.jpg?v=1728682372" alt="Футболка">
                    <h5>Чорна футболка Rainimator</h5>
                    <p>Ціна: 499 грн</p>
                    <a href="product.html" class="btn btn-primary">Детальніше</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://crowdmade.com/cdn/shop/files/back-view-mockup-of-a-hoodie-lying-over-a-solid-surface-33900_45d47a96-2224-4441-a427-e4f1b1a601eb_360x.png?v=1739552934" alt="Худі">
                    <h5>Худі Rainimator</h5>
                    <p>Ціна: 999 грн</p>
                    <a href="product.html" class="btn btn-primary">Детальніше</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://crowdmade.com/cdn/shop/files/Lord_of_the_Void_-_8a8ee8a5-0511-414d-b88a-4350338dc277_360x.jpg?v=1728682172" alt="Кепка">
                    <h5>Біла футболка Rainimator</h5>
                    <p>Ціна: 499 грн</p>
                    <a href="product.html" class="btn btn-primary">Детальніше</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
