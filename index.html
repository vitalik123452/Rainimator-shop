<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Одяг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .hero-section {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1521335629791-ce4aec67dd47?w=1200&h=600&fit=crop') center/cover no-repeat;
            min-height: 600px;
            display: flex;
            align-items: center;
            color: white;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
        
        .product-card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .product-card h5 {
            margin-top: 10px;
            color: #ff4500;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="display-3 fw-bold mb-3">Rainimator Shop - Одяг</h1>
            <p class="lead fs-5 mb-4">Стильний одяг для кожного сезону</p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="products.html" class="btn btn-primary btn-lg">Переглянути колекцію</a>
            </div>
        </div>
    </section>

    <!-- Популярні товари -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Популярні товари</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="product-card">
                        <img src="https://crowdmade.com/cdn/shop/files/Lord_of_the_Void_Black_-_7260455f-6c40-4798-a1af-74d5ba07dce5_360x.jpg?v=1728682372" alt="Product 1">
                        <h5>Футболка lance</h5>
                        <p>Ціна: 499 грн</p>
                        <a href="#" class="btn btn-primary">Купити</a>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <img src="https://crowdmade.com/cdn/shop/files/back-view-mockup-of-a-hoodie-hanging-3589-el1_360x.png?v=1739553176" alt="Product 2">
                        <h5>Худі Rainimator</h5>
                        <p>Ціна: 999 грн</p>
                        <a href="#" class="btn btn-primary">Купити</a>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="product-card">
                        <img src="https://crowdmade.com/cdn/shop/files/Rainimator_-_The_End_Matriarch_Black_-_e2834e59-a906-4a38-a3a5-b375571ea654_360x.jpg?v=1730385624" alt="Product 3">
                        <h5>Футболка ceris</h5>
                        <p>Ціна: 499 грн</p>
                        <a href="#" class="btn btn-primary">Купити</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
