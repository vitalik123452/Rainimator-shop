<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Головна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .product-card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .product-card h5 {
            margin-top: 10px;
            color: #ff4500;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Головна секція -->
    <header class="py-5 text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Ласкаво просимо до Rainimator Shop</h1>
            <p class="lead">Стильний одяг для кожного сезону</p>
            <a href="products.html" class="btn btn-primary btn-lg">Переглянути каталог</a>
        </div>
    </header>


    <script src="scripts/index.js"></script>
</body>

</html>
