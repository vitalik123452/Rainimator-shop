<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .product-details {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }
        
        .product-details img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
        
        footer p {
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Деталі товару -->
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <img src="https://crowdmade.com/cdn/shop/files/Lord_of_the_Void_Black_-_7260455f-6c40-4798-a1af-74d5ba07dce5_360x.jpg?v=1728682372" alt="Товар" class="img-fluid">
            </div>
            <div class="col-md-6">
                <div class="product-details">
                    <h1 class="fw-bold">Футболка lance</h1>
                    <p class="text-muted">Категорія: Футболки
                        <p>
                            <p class="fs-4">Ціна: <span class="text-warning">499 грн</span></p>
                            <p>Опис: Стильна футболка з унікальним дизайном для фанатів Rainimator.</p>
                            <button class="btn btn-primary btn-lg"><i class="bi bi-cart-plus"></i> Додати до кошика</button>
                </div>
            </div>
        </div>
    </div>
</body>
<footer>
    <p>Rainimator shop © 2025 • company</p>
</footer>

</html>
