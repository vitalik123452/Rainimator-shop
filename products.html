<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .product-card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .product-card h5 {
            margin-top: 10px;
            color: #ff4500;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
        
        footer p {
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Фільтри -->
    <div class="container mt-4">
        <div class="card bg-dark text-white border-secondary mb-4">
            <div class="card-body">
                <h4 class="card-title mb-3"><i class="bi bi-funnel"></i> Фільтри</h4>
                <form id="filters-form" class="row g-3">
                    <div class="col-md-4">
                        <label for="search-name" class="form-label">Пошук</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-secondary text-light"><i
                                    class="bi bi-search"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="search-name" placeholder="Назва товару...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="category-filter" class="form-label">Категорія</label>
                        <select id="category-filter" class="form-select bg-dark text-white border-secondary">
                            <option value="">Всі категорії</option>
                            <option value="clothing">Одяг</option>
                            <!-- Added options to match data but keeping structure generic -->
                            <option value="electronics">Електроніка</option>
                            <option value="books">Книги</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ціна (грн)</label>
                        <div class="input-group">
                            <input type="number" class="form-control bg-dark text-white border-secondary" id="min-price" placeholder="Від">
                            <span class="input-group-text bg-secondary border-secondary text-light">-</span>
                            <input type="number" class="form-control bg-dark text-white border-secondary" id="max-price" placeholder="До">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary w-100">Знайти</button>
                        <button type="reset" class="btn btn-outline-secondary" title="Скинути"><i
                                class="bi bi-x-lg"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Каталог товарів -->
    <div class="container py-5">
        <h1 class="text-center mb-4">Каталог одягу</h1>
        <div class="row g-4" id="products-container">
            <!-- Products will be injected here -->
        </div>
    </div>

    <script>
        let allProducts = [];

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p>Товарів не знайдено.</p></div>';
                return;
            }

            products.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}">
                        <h5>${product.name}</h5>
                        <p class="text-muted">Категорія: ${product.category}</p>
                        <p>Ціна: ${product.price} грн</p>
                        <a href="product-template.html?id=${product.id}" class="btn btn-primary">Детальніше</a>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        document.getElementById('filters-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const nameFilter = document.getElementById('search-name').value.toLowerCase();
            const categoryFilter = document.getElementById('category-filter').value;
            const minPrice = parseFloat(document.getElementById('min-price').value) || 0;
            const maxPrice = parseFloat(document.getElementById('max-price').value) || Infinity;

            let filtered = allProducts.filter(product => {
                const name = product.name.toLowerCase();

                let categoryMatch = true;
                if (categoryFilter) {
                    if (categoryFilter === 'clothing' && product.category === 'Одяг') categoryMatch = true;
                    else if (categoryFilter === 'electronics' && product.category === 'Електроніка') categoryMatch = true;
                    else if (categoryFilter === 'books' && product.category === 'Книги') categoryMatch = true;
                    else categoryMatch = false;
                }

                const matchesName = !nameFilter || name.includes(nameFilter);
                const matchesPrice = product.price >= minPrice && product.price <= maxPrice;

                return matchesName && categoryMatch && matchesPrice;
            });

            renderProducts(filtered);
        });

        document.getElementById('filters-form').addEventListener('reset', function() {
            setTimeout(() => renderProducts(allProducts), 0);
        });

        // Load initially
        loadProducts();
    </script>
</body>
<footer>
    <p>Rainimator shop © 2025 • company</p>
</footer>

</html>
