<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainimator Shop - Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        
        .navbar {
            background-color: #1f1f1f;
        }
        
        .product-card {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .product-card h5 {
            margin-top: 10px;
            color: #ff4500;
        }
        
        .btn-primary {
            background-color: #ff4500;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e03e00;
        }
    </style>
</head>

<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shop"></i> Rainimator Shop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-cart3"></i> Кошик
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Фільтри -->
    <div class="container mt-4">
        <h2>Фільтри</h2>
        <form id="filters-form">
            <input type="text" id="search-name" placeholder="Пошук за назвою">
            <select id="category-filter">
                <option value="">Всі категорії</option>
                <option value="electronics">Електроніка</option>
                <option value="clothing">Одяг</option>
                <option value="books">Книги</option>
            </select>
            <input type="text" id="price-range" placeholder="Ціна (наприклад, 100-500)">
            <button type="submit">Фільтрувати</button>
            <button type="reset">Скинути</button>
        </form>
    </div>

    <!-- Каталог товарів -->
    <div class="container py-5">
        <h1 class="text-center mb-4">Каталог одягу</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://crowdmade.com/cdn/shop/files/Lord_of_the_Void_Black_-_7260455f-6c40-4798-a1af-74d5ba07dce5_360x.jpg?v=1728682372" alt="Product 1">
                    <h5>Футболка lance</h5>
                    <p>Ціна: 499 грн</p>
                    <a href="product.html" class="btn btn-primary">Купити</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">

                    <img src="https://crowdmade.com/cdn/shop/files/back-view-mockup-of-a-hoodie-hanging-3589-el1_360x.png?v=1739553176" alt="Product 2">
                    <h5>Худі Rainimator</h5>
                    <p>Ціна: 999 грн</p>
                    <a href="product2.html" class="btn btn-primary">Купити</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://crowdmade.com/cdn/shop/files/Rainimator_-_The_End_Matriarch_Black_-_e2834e59-a906-4a38-a3a5-b375571ea654_360x.jpg?v=1730385624" alt="Product 3">
                    <h5>Футболка ceris</h5>
                    <p>Ціна: 499 грн</p>
                    <a href="product3.html" class="btn btn-primary">Купити</a>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('filters-form').addEventListener('submit', function(event) {
                event.preventDefault();

                const nameFilter = document.getElementById('search-name').value.toLowerCase();
                const categoryFilter = document.getElementById('category-filter').value;
                const priceRange = document.getElementById('price-range').value;

                const products = document.querySelectorAll('.product-card');

                products.forEach(product => {
                    const name = product.getAttribute('data-name').toLowerCase();
                    const category = product.getAttribute('data-category');
                    const price = parseInt(product.getAttribute('data-price'), 10);

                    let [min, max] = priceRange.split('-').map(Number);
                    if (!min) min = 0;
                    if (!max) max = Infinity;

                    const matchesName = !nameFilter || name.includes(nameFilter);
                    const matchesCategory = !categoryFilter || category === categoryFilter;
                    const matchesPrice = !priceRange || (price >= min && price <= max);

                    if (matchesName && matchesCategory && matchesPrice) {
                        product.style.display = 'block';
                    } else {
                        product.style.display = 'none';
                    }
                });
            });

            document.getElementById('filters-form').addEventListener('reset', function() {
                const products = document.querySelectorAll('.product-card');
                products.forEach(product => {
                    product.style.display = 'block';
                });
            });
        </script>
</body>

</html>
